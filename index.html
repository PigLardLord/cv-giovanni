<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curriculum Vitae</title>
    <link rel="stylesheet" href="vendor/fonts/fonts.css?v=20260911-fonts1" />
    <link rel="stylesheet" href="style.css?v=20260912-pin1" />
    <link rel="stylesheet" href="layouts.css?v=20260912-nav1" />
    <link rel="stylesheet" href="design-glacier.css?v=20260912-print1" />
    <link rel="stylesheet" href="print.css?v=20260911-fonts1" media="print" />
    <script type="module" defer src="script.js?v=20260911-fonts1"></script>
  </head>
  <body>
    <nav
      class="layout-switcher"
      aria-label="CV layout"
      data-i18n-attr="aria-label:accessibility.layoutSwitcher"
    >
      <a data-layout-link="nerd" data-i18n="layouts.nerd">Nerd Mode</a>
      <a data-layout-link="spotlight" data-i18n="layouts.spotlight">Impact Spotlight</a>
      <a data-layout-link="technical" data-i18n="layouts.technical">Technical Profile</a>
    </nav>
    <!-- Nerd Mode's editor: the same profile as a Swift file. It stays hidden unless the nerd
         layout's screen stylesheet shows it, so paper, every other layout and a page without CSS
         never meet it. renderers/SourceRenderer.js writes the file. -->
    <div class="source-view" hidden>
      <nav
        class="source-navigator"
        aria-label="Sections"
        data-i18n-attr="aria-label:source.outline"
      >
        <p class="source-navigator-file" aria-hidden="true"><span data-source-file></span></p>
        <ol id="source-outline" class="source-outline"></ol>
      </nav>
      <div class="source-editor">
        <p class="source-tabs" aria-hidden="true">
          <span class="source-tab" data-source-file></span>
        </p>
        <div id="source-code" class="source-code"></div>
      </div>
      <aside class="source-preview" aria-label="Preview" data-i18n-attr="aria-label:source.preview">
        <p class="source-preview-bar" aria-hidden="true">
          <span data-i18n-attr="data-text:source.preview"></span>
          <span data-i18n-attr="data-text:source.device"></span>
        </p>
        <div class="simulator">
          <div class="simulator-screen">
            <img
              class="simulator-portrait"
              src="profile.webp"
              alt=""
              data-i18n-attr="alt:accessibility.profilePhoto"
            />
            <div id="source-card" class="app-card"></div>
          </div>
        </div>
      </aside>
      <!-- The call button's easter egg: an alert telling the reader to dial the number themselves. -->
      <dialog
        id="source-call"
        class="app-alert"
        role="alertdialog"
        aria-labelledby="source-call-title"
        aria-describedby="source-call-message"
      >
        <h2 id="source-call-title" class="app-alert-title"></h2>
        <p id="source-call-message" class="app-alert-message"></p>
        <form method="dialog" class="app-alert-actions">
          <button id="source-call-dismiss" class="app-alert-button" type="submit"></button>
        </form>
      </dialog>
    </div>
    <div class="container">
      <!-- Hero Section with Key Info -->
      <header class="hero-section">
        <div class="hero-content">
          <div class="hero-text">
            <h1 id="name" class="hero-name"></h1>
            <h2 id="title" class="hero-title"></h2>
            <p id="subtitle" class="hero-subtitle" hidden></p>
            <p id="profile" class="hero-summary"></p>
            <p id="availability" class="hero-availability" hidden></p>
          </div>
          <div class="hero-sidebar">
            <div class="profile-image-wrapper">
              <img
                id="profile-pic"
                src="profile.webp"
                alt=""
                data-i18n-attr="alt:accessibility.profilePhoto"
              />
            </div>
            <div class="contact-card">
              <div class="contact-item">
                <span class="contact-icon" aria-hidden="true"></span>
                <span id="location"></span>
              </div>
              <div id="contacts" class="contact-details"></div>
              <div class="social-links"></div>
            </div>
          </div>
        </div>
      </header>

      <!-- Key Skills Spotlight -->
      <section class="skills-spotlight">
        <h3 class="spotlight-title" data-i18n="cv:sections.skills"></h3>
        <div id="skills" class="skills-showcase"></div>
      </section>

      <main class="main-content">
        <div class="content-grid">
          <!-- Primary Column -->
          <div class="primary-column">
            <section class="experience-section">
              <h3 class="section-title">
                <span class="title-accent"></span>
                <span data-i18n="cv:sections.experience"></span>
              </h3>
              <div id="experience" class="experience-content"></div>
            </section>

            <section class="certifications-section">
              <h3 class="section-title">
                <span class="title-accent"></span>
                <span data-i18n="cv:sections.certifications"></span>
              </h3>
              <ul id="certifications" class="certifications-list"></ul>
            </section>
          </div>

          <!-- Secondary Column -->
          <div class="secondary-column">
            <section class="education-section">
              <h3 class="section-title">
                <span class="title-accent"></span>
                <span data-i18n="cv:sections.education"></span>
              </h3>
              <div id="education" class="education-content"></div>
            </section>

            <section class="languages-section">
              <h3 class="section-title">
                <span class="title-accent"></span>
                <span data-i18n="cv:sections.languages"></span>
              </h3>
              <ul id="languages" class="languages-list"></ul>
            </section>

            <section class="interests-section">
              <h3 class="section-title">
                <span class="title-accent"></span>
                <span data-i18n="cv:sections.interests"></span>
              </h3>
              <div id="interests" class="interests-tags"></div>
            </section>
          </div>
        </div>
      </main>

      <footer class="print-footer">
        <a id="download-pdf" class="print-button" href="#" download>
          <span class="button-icon">↓</span>
          <span data-i18n="actions.downloadPdf">Download PDF</span>
        </a>
        <button id="print-browser" class="print-button print-button-secondary" type="button">
          <span data-i18n="actions.print">Print</span>
        </button>
      </footer>
    </div>
  </body>
</html>
