name: Gates

# Every gate this project has, on every push and every pull request. Until now each ran only when
# someone remembered to run it, and the audits have already caught defects that shipped for months (#28).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the run for the older one moot, except on main: every run there
# ends in a deploy, so a newer run waits for the older one to finish instead of cancelling it mid-publish.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # tests/TicketsCloseByHand.test.js reads every commit the branch adds to origin/main.
          fetch-depth: 0

      # The reports are tracked, so a run that stops before an audit would upload the committed ones as
      # if this run had written them. Everything an audit writes from here on is newer than this mark.
      - name: Mark the start of the run
        run: touch "$RUNNER_TEMP/run-started"

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # Every audit reads the PDFs through poppler: pdftotext, pdfinfo, pdffonts, pdfimages, pdftoppm.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Tests
        run: npm test

      # The CV a recruiter downloads is the page, printed by Chrome (#144, #149). generate-pdfs exits 2 and writes
      # nothing when it finds no browser, and any exit but 0 fails the step. The runner image ships Chrome, and it
      # is not pinned: the print embeds only static TrueType faces, and the print audit below fails the run on a
      # Type 3 font or a glued word before anything is published (the decision on #149).
      - name: Print the CV from the page
        run: npm run build:pdf
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # audit-print reads the files the build step wrote, the ones this run publishes. It exits 2 and checks
      # nothing when one is missing, so an audit that did not run can never read as a pass.
      - name: Audit what the browser prints
        run: npm run audit:print

      - name: Audit what a stranger's parser recovers
        run: npm run audit:ats

      # audit-screen exits 2 and checks nothing when it finds no browser or no built manifest, and any exit
      # but 0 fails the step. JSDOM cannot see what a selection copies; this can (#62, #89).
      - name: Audit what a reader copies off the screen
        run: npm run audit:screen
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # What GitHub Pages publishes: the tree as committed, with the PDFs this run built from the committed
      # profile and has just audited, never files built on someone's machine (#43). Only on main, the one
      # branch that is published (#44), and only when every step above passed.
      - name: Assemble the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # applications/ is gitignored, so a checkout never has one. Make sure rather than trust it.
          test ! -e applications
          # The editor (#23) writes the CV through the local API, which only npm run serve answers on the
          # owner's machine. Published, it could only fail, so the site leaves it out.
          rsync -a --exclude='.*' --exclude=node_modules --exclude=editor.html --exclude=editor.js --exclude=editor.css --exclude=editor/ ./ "$RUNNER_TEMP/site/"
          test ! -e "$RUNNER_TEMP/site/applications"
          test ! -e "$RUNNER_TEMP/site/editor.html"
          test ! -e "$RUNNER_TEMP/site/editor"
          ls "$RUNNER_TEMP/site"

      - name: Hand the site to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site/

      - name: Collect the reports this run wrote
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/audit-reports"
          find docs -maxdepth 1 -name '*_AUDIT.md' -newer "$RUNNER_TEMP/run-started" -exec cp {} "$RUNNER_TEMP/audit-reports/" \;
          ls "$RUNNER_TEMP/audit-reports"

      - name: Keep them
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: audit-reports
          path: ${{ runner.temp }}/audit-reports/
          if-no-files-found: ignore

  # Publishing is what a green run on main does, never a second road: this job runs only for a push to
  # main, only after every step of `gates` passed, and deploys the site that run assembled (#45). GitHub
  # Pages builds nothing on its own any more; its source is this workflow.
  deploy:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time, whatever starts it: a second waits for the first rather than cancelling it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Say which commit went live
        run: echo "Published $GITHUB_SHA to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
